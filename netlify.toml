[build]
  command = "npm run build"
  publish = "dist"

# Branch deploy for "dev" — same build as production, but Netlify still
# needs "Branch deploys" turned on for this branch in the dashboard
# (Site configuration -> Build & deploy -> Continuous deployment ->
# Branches and deploy contexts) before it actually starts building it.
# This context block just makes the settings explicit per-branch so they
# don't silently drift from [build] later (e.g. once real env vars are
# added for email sending, a staging-only key would go under here).
[context.dev]
  command = "npm run build"
  publish = "dist"

# HTTP → HTTPS redirect
[[redirects]]
  from = "http://primetriskelion.com/*"
  to = "https://primetriskelion.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.primetriskelion.com/*"
  to = "https://primetriskelion.com/:splat"
  status = 301
  force = true

# Hashed assets (Astro adds content hash to filenames) — cache forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts in /public/fonts (if any)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images / svg
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always revalidate so deploys propagate immediately
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # images.unsplash.com is allowed for the placeholder project photos in
    # ShowcaseSection/SelectedWorkSection/projects — CSP was silently
    # blocking them outright. Drop it once those are swapped for real,
    # self-hosted project images.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' https://data.shaders.com; worker-src blob:; frame-ancestors 'none'"
