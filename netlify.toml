[build]
  command = "npm run build"
  publish = "dist"

# HTTP → HTTPS redirect
[[redirects]]
  from = "http://primetriskelion.com/*"
  to = "https://primetriskelion.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.primetriskelion.com/*"
  to = "https://primetriskelion.com/:splat"
  status = 301
  force = true

# Hashed assets (Astro adds content hash to filenames) — cache forever
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts in /public/fonts (if any)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images / svg
[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always revalidate so deploys propagate immediately
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://data.shaders.com; worker-src blob:; frame-ancestors 'none'"
